name: CI - Validar Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe
        run: |
          python -m py_compile main.py
          python -m py_compile utils/downloader.py
          python -m py_compile utils/shopee.py
          python -m py_compile cogs/search.py
          python -m py_compile cogs/download.py
          python -m py_compile cogs/shopee.py

      - name: Verificar token (secret)
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "⚠️  DISCORD_TOKEN não configurado em Settings > Secrets and variables > Actions"
            echo "O bot não vai funcionar até configurar."
          else
            echo "✅ DISCORD_TOKEN configurado"
          fi
